<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | VHL Global Industries</title>
  <meta name="description" content="The page you are looking for cannot be found. Return to VHL Global Industries homepage." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%23203a5c'/><path d='M4 20a16 16 0 0 0 32 0c-6 4-14 5-22 1-4-2-7-2-10-1Z' fill='%2338a169'/></svg>" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    :root {
      --navy: #203a5c;
      --navy-deep: #0c1726;
      --navy-card: #142339;
      --brand-green: #3b82f6;
      --brand-green-hover: #2563eb;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--navy-deep);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .error-header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(12, 23, 38, 0.85);
      backdrop-filter: blur(10px);
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-light);
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      line-height: 1.1;
      color: var(--text-light);
    }

    .logo-subtitle {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--brand-green);
    }

    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      position: relative;
    }

    .error-main::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 161, 105, 0.12) 0%, rgba(32, 58, 92, 0.05) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .error-container {
      max-width: 640px;
      position: relative;
      z-index: 1;
      padding: 48px 36px;
      background: rgba(20, 35, 57, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .error-code {
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: transparent;
      background: linear-gradient(135deg, #ffffff 30%, var(--brand-green) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: 12px;
      user-select: none;
    }

    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .error-description {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 36px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--brand-green);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(56, 161, 105, 0.35);
    }

    .btn-home:hover {
      background-color: var(--brand-green-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 161, 105, 0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .error-footer {
      padding: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .error-footer a {
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .error-footer a:hover {
      color: var(--brand-green);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="error-header">
    <a href="index.html#home" class="logo-link" aria-label="VHL Global Industries Home">
      <svg viewBox="0 0 40 40" class="logo-icon" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="var(--navy)"></circle>
        <path d="M4 20a16 16 0 0 0 32 0c-6 4-14 5-22 1-4-2-7-2-10-1Z" fill="var(--brand-green)"></path>
        <ellipse cx="20" cy="20" rx="7" ry="18" fill="none" stroke-width="1.5" stroke="rgba(255,255,255,0.7)"></ellipse>
        <path d="M2 20h36M6 11h28" stroke-width="1.5" stroke="rgba(255,255,255,0.7)" fill="none"></path>
      </svg>
      <span class="logo-text">
        <span class="logo-title">VHL</span>
        <span class="logo-subtitle">GLOBAL INDUSTRIES</span>
      </span>
    </a>
  </header>

  <!-- Centered Content -->
  <main class="error-main">
    <div class="error-container">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-description">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div class="error-actions">
        <a href="index.html#home" class="btn-home">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Home
        </a>
        <a href="index.html#contact" class="btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
          Contact Us
        </a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="error-footer">
    <p>&copy; 2026 VHL Global Industries. All rights reserved.</p>
  </footer>

</body>
</html>
